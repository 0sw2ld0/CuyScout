name: CuyScout CI

on:
  push:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: macos-15
    # Un test colgado no debe retener el runner: la suite completa tarda segundos.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift package
        timeout-minutes: 12
        run: swift test --parallel
      - name: Build executables
        run: swift build -c release

