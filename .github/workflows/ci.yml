name: CuyScout CI

on:
  push:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Scripts/test_android_sessions.py"
      - "Scripts/test_android_project.py"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Scripts/test_android_sessions.py"
      - "Scripts/test_android_project.py"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: macos-15
    # Un test colgado no debe retener el runner: la suite completa tarda segundos.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exporter conformance dependencies
        run: npm ci --prefix Tests/ExporterRuntime --ignore-scripts
      - name: Verify Swift package
        timeout-minutes: 12
        run: swift test --parallel
      - name: Build executables
        run: swift build -c release

      - name: Android HTTP/MCP projects and cold replay (test doubles)
        run: python3 Scripts/test_android_sessions.py .build/release/cuyscout
