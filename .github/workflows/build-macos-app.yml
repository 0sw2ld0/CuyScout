name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          swift test --parallel
          Scripts/build_cuyscout_app.sh
      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent .build/CuyScout.app CuyScout-macos-arm64.zip
          shasum -a 256 CuyScout-macos-arm64.zip > CuyScout-macos-arm64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: CuyScout-macos-arm64
          path: |
            CuyScout-macos-arm64.zip
            CuyScout-macos-arm64.zip.sha256
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" CuyScout-macos-arm64.zip CuyScout-macos-arm64.zip.sha256 --generate-notes
