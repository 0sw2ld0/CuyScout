name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Una etiqueta v* solo valida: compila, prueba y deja el ZIP como artifact del workflow.
# El instalador público es el .dmg notarizado que se sube a mano (Scripts/build_dmg.sh);
# publicar aquí un ZIP sin notarizar lo bloquearía Gatekeeper y chocaría con ese release.
jobs:
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          swift test --parallel
          Scripts/build_cuyscout_app.sh
      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent .build/CuyScout.app CuyScout-macos-arm64.zip
          shasum -a 256 CuyScout-macos-arm64.zip > CuyScout-macos-arm64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: CuyScout-macos-arm64
          path: |
            CuyScout-macos-arm64.zip
            CuyScout-macos-arm64.zip.sha256
